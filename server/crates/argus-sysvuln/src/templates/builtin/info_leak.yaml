# 信息泄露检测模板（自动生成）
- id: INFO-LEAK-010
  name: Git Config Exposure
  severity: high
  author: argus
  description: "Git Config Exposure"
  fix_advice: "限制 /.git/config 路径访问"
  detection:
    method: GET
    path: /.git/config
    match_rule:
      match_type: Body
      pattern: "[core]"
  metadata:
    category: info_leak
    tags: ["leak", "git"]
    service: git
    port: 80
